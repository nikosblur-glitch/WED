<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS — Connect. Create. Belong.</title>
    <link rel="stylesheet" href="styles.css">
    <!-- GSAP for Premium Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <!-- Custom Magnetic Cursor -->
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <!-- Background Atmospheric Canvas -->
    <canvas id="nexus-environment"></canvas>

    <!-- Cinematic Intro -->
    <div id="intro-sequence">
        <img src="image.png" alt="NEXUS Logo" class="intro-logo">
        <h1 class="intro-text">WELCOME TO NEXUS</h1>
    </div>

    <!-- Main Application UI -->
    <main class="nexus-interface">
        <nav class="glass-nav">
            <div class="nav-brand">NEXUS</div>
            <div class="nav-links">
                <a href="#community">Community</a>
                <a href="#events">Events</a>
                <a href="#command-center">Command Center</a>
            </div>
            <a href="https://discord.gg/qBGRh2w5P" class="btn-premium" target="_blank">JOIN DISCORD</a>
        </nav>

        <section class="hero-layer">
            <h1 class="hero-title">CONNECT. CREATE. BELONG.</h1>
            <p class="hero-subtitle">Step into a curated digital experience.</p>
            <div class="hero-actions">
                <a href="#command-center" class="btn-ghost">ENTER NEXUS</a>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
